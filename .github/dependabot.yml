version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories: ["/typescript", "/mcp"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directories: ["/go", "/cli"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: composer
    directory: "/php"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      composer-minor-patch:
        update-types: [minor, patch]
