name: publish-npm

# Publishes @waffle/sdk and @waffle/mcp to npm when their package.json
# version changes on a push to main. Needs an NPM_TOKEN repo secret
# (npmjs.com -> Access Tokens -> Granular Access Token, scoped to publish
# the @waffle org/scope) — unset until provided, this workflow just no-ops
# (npm publish fails loudly rather than silently) until then.

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - "mcp/**"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.f.outputs.typescript }}
      mcp: ${{ steps.f.outputs.mcp }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            typescript:
              - 'typescript/**'
            mcp:
              - 'mcp/**'

  publish:
    needs: changes
    if: ${{ needs.changes.outputs.typescript == 'true' || needs.changes.outputs.mcp == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dir: typescript
            enabled: ${{ needs.changes.outputs.typescript }}
          - dir: mcp
            enabled: ${{ needs.changes.outputs.mcp }}
    steps:
      - uses: actions/checkout@v6
        if: matrix.enabled == 'true'
      - uses: actions/setup-node@v4
        if: matrix.enabled == 'true'
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
        if: matrix.enabled == 'true'
        working-directory: ${{ matrix.dir }}
      - run: npm run build --if-present
        if: matrix.enabled == 'true'
        working-directory: ${{ matrix.dir }}
      - name: Publish if version changed
        if: matrix.enabled == 'true'
        working-directory: ${{ matrix.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          local_version=$(node -p "require('./package.json').version")
          published_version=$(npm view "$name" version 2>/dev/null || echo "0.0.0")
          if [ "$local_version" = "$published_version" ]; then
            echo "$name@$local_version already published, skipping"
            exit 0
          fi
          npm publish --access public
