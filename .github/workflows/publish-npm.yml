name: publish-npm

# Publishes @getwaffle/sdk and @getwaffle/mcp to npm when their package.json
# version changes on a push to main. Needs an NPM_TOKEN repo secret
# (npmjs.com -> Access Tokens -> Granular Access Token, scoped to publish
# the @getwaffle scope) — unset until provided, this workflow just no-ops
# (npm publish fails loudly rather than silently) until then.

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - "mcp/**"
      # Editing this workflow re-runs it; publishing is a no-op for any
      # package whose version is already on npm.
      - ".github/workflows/publish-npm.yml"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.f.outputs.typescript }}
      mcp: ${{ steps.f.outputs.mcp }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            typescript:
              - 'typescript/**'
              - '.github/workflows/publish-npm.yml'
            mcp:
              - 'mcp/**'
              - '.github/workflows/publish-npm.yml'

  publish:
    needs: changes
    if: ${{ needs.changes.outputs.typescript == 'true' || needs.changes.outputs.mcp == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      # Publish the SDK before mcp (mcp's published dependency points at it),
      # and let a failure in one not cancel the other.
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - dir: typescript
            enabled: ${{ needs.changes.outputs.typescript }}
          - dir: mcp
            enabled: ${{ needs.changes.outputs.mcp }}
    steps:
      - uses: actions/checkout@v6
        if: matrix.enabled == 'true'
      - uses: actions/setup-node@v4
        if: matrix.enabled == 'true'
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      # mcp depends on file:../typescript, and npm builds that directory while
      # installing mcp, so the SDK's own dev dependencies must be installed
      # (npm ci also runs its prepare/build) before mcp's install.
      - name: Install and build the SDK that mcp links to
        if: matrix.enabled == 'true' && matrix.dir == 'mcp'
        run: npm ci
        working-directory: typescript
      - run: npm ci
        if: matrix.enabled == 'true'
        working-directory: ${{ matrix.dir }}
      - run: npm run build --if-present
        if: matrix.enabled == 'true'
        working-directory: ${{ matrix.dir }}
      - name: Publish if version changed
        if: matrix.enabled == 'true'
        working-directory: ${{ matrix.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning title=npm publish skipped::NPM_TOKEN repo secret is not set; ${{ matrix.dir }} was built but not published."
            exit 0
          fi
          name=$(node -p "require('./package.json').name")
          local_version=$(node -p "require('./package.json').version")
          published_version=$(npm view "$name" version 2>/dev/null || echo "0.0.0")
          if [ "$local_version" = "$published_version" ]; then
            echo "$name@$local_version already published, skipping"
            exit 0
          fi
          # mcp links the SDK as file:../typescript for local development; a
          # published package must depend on the registry version instead.
          if [ "${{ matrix.dir }}" = "mcp" ]; then
            sdk_version=$(node -p "require('../typescript/package.json').version")
            npm pkg set "dependencies.@getwaffle/sdk=^$sdk_version"
          fi
          npm publish --access public
