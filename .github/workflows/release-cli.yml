name: release-cli

# Cross-compiles the waffle CLI for every OS/arch install.sh knows how
# to fetch, and publishes them as a GitHub Release. Triggered by pushing
# a tag matching cli/vX.Y.Z — the version embedded in the binary (see
# internal/cli/root.go's Version var) comes straight from the tag, not a
# separate version file, so there's exactly one place a release number
# is decided.

on:
  push:
    tags:
      - "cli/v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
      - name: Resolve version from tag
        id: v
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^cli/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::tag '$GITHUB_REF_NAME' is not cli/vX.Y.Z[-prerelease]"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#cli/}" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w -X github.com/getwaffle/sdk/cli/internal/cli.Version=${VERSION}" -o "waffle${ext}" .
          if [ "$GOOS" = "windows" ]; then
            zip "waffle-cli_${GOOS}_${GOARCH}.zip" "waffle${ext}"
          else
            tar -czf "waffle-cli_${GOOS}_${GOARCH}.tar.gz" "waffle${ext}"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: waffle-cli_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            cli/waffle-cli_*.tar.gz
            cli/waffle-cli_*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          # shellcheck disable=SC2035
          sha256sum * > checksums.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/waffle-cli_*.tar.gz
            dist/waffle-cli_*.zip
            dist/checksums.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: "waffle-cli ${{ github.ref_name }}"
          files: |
            dist/waffle-cli_*.tar.gz
            dist/waffle-cli_*.zip
            dist/checksums.txt
          generate_release_notes: true
